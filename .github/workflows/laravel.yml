name: Smart Attendance — CI/CD

# Gatilhos: roda em push e em Pull Requests para a branch main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Variáveis de ambiente compartilhadas entre todos os jobs
env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  # Credenciais do banco de testes (mesmas usadas pelo serviço postgres abaixo)
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: smart_attendance_test
  DB_USERNAME: sa_user
  DB_PASSWORD: sa_secret
  CACHE_STORE: array
  SESSION_DRIVER: array

jobs:

  # ===========================================================================
  # MODULO 1 — CONFIGURACAO
  # Instala todas as dependencias (PHP + Node), compila o front-end e
  # salva os artefatos para que os proximos jobs nao precisem repetir esse trabalho.
  # ===========================================================================
  configuracao:
    name: "1 - Configuracao"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache das dependencias do Composer
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-vendor-

      - name: Instalar dependencias do Composer
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Criar arquivo .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Gerar chave da aplicacao
        run: php artisan key:generate

      - name: Instalar dependencias NPM e compilar Vite
        run: |
          npm ci
          npm run build

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Salvar dependencias PHP como artefato
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor
          retention-days: 1

      - name: Salvar assets compilados como artefato
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          retention-days: 1

      - name: Salvar arquivo .env como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dotenv
          path: .env
          retention-days: 1

  # ===========================================================================
  # MODULO 2 — BANCO DE DADOS
  # Sobe o PostgreSQL (identico ao de producao), restaura os artefatos
  # do Modulo 1 e executa todas as migrations para validar o schema.
  # ===========================================================================
  banco_de_dados:
    name: "2 - Banco de Dados"
    runs-on: ubuntu-latest
    needs: configuracao

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Restaurar .env do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: dotenv

      - name: Executar todas as Migrations
        run: php artisan migrate --force

      - name: Verificar status das Migrations
        run: php artisan migrate:status

  # ===========================================================================
  # MODULO 3 — VERIFICACAO DE SEGURANCA DO CODIGO E DO BANCO DE DADOS
  # Audita vulnerabilidades nos pacotes PHP e verifica o padrao de codigo
  # com Laravel Pint. Roda em paralelo com o Modulo 2.
  # ===========================================================================
  seguranca:
    name: "3 - Seguranca do Codigo e Banco"
    runs-on: ubuntu-latest
    needs: configuracao

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Restaurar .env do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: dotenv

      - name: Auditoria de vulnerabilidades PHP (composer audit)
        run: composer audit

      - name: Verificar padrao de codigo (Laravel Pint)
        # O "--test" falha se houver estilo fora do padrao.
        # Troque "|| true" por nada quando quiser bloquear merges com codigo mal formatado.
        run: ./vendor/bin/pint --test || true

      - name: Verificar integridade das migrations no banco
        run: php artisan migrate --force

      - name: Listar rotas do sistema (detecta conflitos de rota)
        run: php artisan route:list

  # ===========================================================================
  # MODULO 4 — VERIFICAR ERROS NAS 3 CLASSES (Aluno, Master e Professor)
  # Valida que as factories criam registros corretamente para cada tipo de
  # usuario e que o fluxo de primeiro acesso funciona para os 3 guards.
  # Depende dos Modulos 2 e 3 (banco OK + seguranca OK).
  # ===========================================================================
  verificar_classes:
    name: "4 - Classes Aluno, Master e Professor"
    runs-on: ubuntu-latest
    needs: [ banco_de_dados, seguranca ]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Restaurar assets do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build

      - name: Restaurar .env do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: dotenv

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Executar migrations
        run: php artisan migrate --force

      # Roda somente o PrimeiroAcessoCriarSenhaTest, que cobre os 3 guards:
      # Aluno  → redireciona para dashboard.aluno
      # Professor → redireciona para dashboard.professor
      # Master → redireciona para dashboard.master
      - name: Testar classe Aluno (primeiro acesso e criacao de senha)
        run: php artisan test --filter PrimeiroAcessoCriarSenhaTest

      # Roda o IsolamentoPaineisTest que valida os guards Aluno e Professor
      - name: Testar isolamento entre classes (Aluno vs Professor)
        run: php artisan test --filter IsolamentoPaineisTest

  # ===========================================================================
  # MODULO 5 — TESTES FINAIS
  # Executa a suite completa de testes de feature e unit.
  # So roda se as classes individuais passaram no Modulo 4.
  # ===========================================================================
  testes_finais:
    name: "5 - Testes Finais"
    runs-on: ubuntu-latest
    needs: verificar_classes

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Restaurar assets do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build

      - name: Restaurar .env do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: dotenv

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Executar migrations
        run: php artisan migrate --force

      # Suite completa: ExampleTest + QrCodePresencaTest + IsolamentoPaineisTest
      #                 + PrimeiroAcessoCriarSenhaTest + Unit/ExampleTest
      - name: Executar suite completa de testes
        run: php artisan test

  # ===========================================================================
  # MODULO 6 — TRABALHO COMPLETO (Deploy)
  # So executa se TODOS os 5 modulos anteriores passaram E o evento for
  # um push direto na branch main (nao em Pull Requests).
  #
  # Para ativar: configure os Secrets abaixo em Settings > Secrets > Actions:
  #   SSH_HOST        — IP ou hostname do servidor
  #   SSH_USERNAME    — Usuario SSH (ex: ubuntu, deploy)
  #   SSH_PRIVATE_KEY — Chave SSH privada (ssh-keygen -t ed25519)
  #   DEPLOY_PATH     — Caminho no servidor (ex: /var/www/smart-attendance)
  # ===========================================================================
  trabalho_completo:
    name: "6 - Trabalho Completo"
    runs-on: ubuntu-latest
    needs: testes_finais
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # Descomente o bloco abaixo quando tiver um servidor configurado:
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USERNAME }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd ${{ secrets.DEPLOY_PATH }}
      #       php artisan down
      #       git pull origin main
      #       composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      #       npm ci
      #       npm run build
      #       php artisan migrate --force
      #       php artisan optimize:clear
      #       php artisan config:cache
      #       php artisan route:cache
      #       php artisan view:cache
      #       chmod -R 775 storage bootstrap/cache
      #       php artisan up

      - name: Pipeline concluido com sucesso
        run: |
          echo "Modulo 1 - Configuracao:       OK"
          echo "Modulo 2 - Banco de Dados:     OK"
          echo "Modulo 3 - Seguranca:          OK"
          echo "Modulo 4 - Classes (3 guards): OK"
          echo "Modulo 5 - Testes Finais:      OK"
          echo "Modulo 6 - Trabalho Completo:  Aguardando servidor SSH"
          echo ""
          echo "Para ativar o deploy automatico, configure os Secrets:"
          echo "  SSH_HOST, SSH_USERNAME, SSH_PRIVATE_KEY, DEPLOY_PATH"