name: Smart Attendance — CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: smart_attendance_test
  DB_USERNAME: sa_user
  DB_PASSWORD: sa_secret
  CACHE_STORE: array
  SESSION_DRIVER: array

jobs:

  # ===========================================================================
  # MODULO 1 — CONFIGURACAO
  # Verifica versoes dos componentes, checa pacotes desatualizados,
  # instala dependencias, compila o front-end e salva artefatos.
  # ===========================================================================
  configuracao:
    name: "1 - Configuracao"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verificar versoes dos componentes instalados
        run: |
          echo "=== PHP ==="
          php --version
          echo "=== Composer ==="
          composer --version
          echo "=== Node.js ==="
          node --version
          echo "=== NPM ==="
          npm --version

      - name: Cache das dependencias do Composer
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-vendor-

      - name: Instalar dependencias do Composer
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Verificar pacotes PHP desatualizados (composer outdated)
        run: |
          # Captura o output para arquivo — sera incluido no PDF do Modulo 6
          composer outdated --direct --no-interaction 2>&1 | tee composer-outdated.txt || true
          if [ ! -s composer-outdated.txt ]; then
            echo "Todos os pacotes PHP estao atualizados." > composer-outdated.txt
          fi

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Instalar dependencias NPM e compilar Vite
        run: |
          npm ci
          npm run build

      - name: Verificar pacotes NPM desatualizados (npm outdated)
        run: |
          # Captura o output para arquivo — sera incluido no PDF do Modulo 6
          npm outdated 2>&1 | tee npm-outdated.txt || true
          if [ ! -s npm-outdated.txt ]; then
            echo "Todos os pacotes NPM estao atualizados." > npm-outdated.txt
          fi

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Salvar vendor como artefato
        uses: actions/upload-artifact@v5
        with:
          name: vendor
          path: vendor
          retention-days: 1

      - name: Salvar assets compilados como artefato
        uses: actions/upload-artifact@v5
        with:
          name: public-build
          path: public/build
          retention-days: 1

      - name: Salvar relatorios de pacotes desatualizados como artefato
        uses: actions/upload-artifact@v5
        with:
          name: outdated-reports
          path: |
            composer-outdated.txt
            npm-outdated.txt
          retention-days: 1

  # ===========================================================================
  # MODULO 2 — BANCO DE DADOS
  # ===========================================================================
  banco_de_dados:
    name: "2 - Banco de Dados"
    runs-on: ubuntu-latest
    needs: configuracao

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v5
        with:
          name: vendor
          path: vendor

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Executar todas as Migrations
        run: php artisan migrate --force

      - name: Verificar status das Migrations
        run: php artisan migrate:status

  # ===========================================================================
  # MODULO 3 — VERIFICACAO DE SEGURANCA DO CODIGO E DO BANCO DE DADOS
  # ===========================================================================
  seguranca:
    name: "3 - Seguranca do Codigo e Banco"
    runs-on: ubuntu-latest
    needs: configuracao

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v5
        with:
          name: vendor
          path: vendor

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Auditoria de vulnerabilidades PHP (composer audit)
        run: composer audit

      - name: Verificar padrao de codigo (Laravel Pint)
        run: ./vendor/bin/pint --test || true

      - name: Verificar integridade das migrations no banco
        run: php artisan migrate --force

      - name: Listar rotas do sistema (detecta conflitos de rota)
        run: php artisan route:list

  # ===========================================================================
  # MODULO 4 — VERIFICAR ERROS NAS 3 CLASSES (Aluno, Master e Professor)
  # ===========================================================================
  verificar_classes:
    name: "4 - Classes Aluno, Master e Professor"
    runs-on: ubuntu-latest
    needs: [ banco_de_dados, seguranca ]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v5
        with:
          name: vendor
          path: vendor

      - name: Restaurar assets do Modulo 1
        uses: actions/download-artifact@v5
        with:
          name: public-build
          path: public/build

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Executar migrations
        run: php artisan migrate --force

      - name: Testar classe Aluno e Professor (PrimeiroAcessoCriarSenhaTest)
        run: php artisan test --filter PrimeiroAcessoCriarSenhaTest

      - name: Testar isolamento entre classes (IsolamentoPaineisTest)
        run: php artisan test --filter IsolamentoPaineisTest

  # ===========================================================================
  # MODULO 5 — TESTES FINAIS
  # ===========================================================================
  testes_finais:
    name: "5 - Testes Finais"
    runs-on: ubuntu-latest
    needs: verificar_classes

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v5

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v5
        with:
          name: vendor
          path: vendor

      - name: Restaurar assets do Modulo 1
        uses: actions/download-artifact@v5
        with:
          name: public-build
          path: public/build

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Executar migrations
        run: php artisan migrate --force

      - name: Executar suite completa de testes
        run: php artisan test

  # ===========================================================================
  # MODULO 6 — TRABALHO COMPLETO
  # Gera um relatorio PDF com as informacoes do pipeline e das modificacoes
  # do commit. O PDF fica disponivel para download nos artefatos do GitHub.
  # So executa em push direto na branch main.
  # ===========================================================================
  trabalho_completo:
    name: "6 - Trabalho Completo"
    runs-on: ubuntu-latest
    needs: testes_finais
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Permissao de escrita necessaria para commitar o PDF de volta ao repositorio
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Necessario para acessar o historico completo do git
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar pandoc e wkhtmltopdf para geracao de PDF
        run: |
          sudo apt-get update -q
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Restaurar relatorios de pacotes desatualizados
        uses: actions/download-artifact@v5
        with:
          name: outdated-reports

      - name: Coletar informacoes do commit e gerar relatorio Markdown
        run: |
          # Informacoes do ambiente
          DATA_HORA=$(date '+%d/%m/%Y às %H:%M:%S UTC')
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"
          AUTOR="${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"
          RUN_ID="${{ github.run_id }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Pacotes PHP desatualizados e comandos de correcao
          COMPOSER_OUTDATED_RAW=$(cat composer-outdated.txt 2>/dev/null || echo "Informacao nao disponivel")

          if echo "$COMPOSER_OUTDATED_RAW" | grep -q "atualizados"; then
            COMPOSER_SECTION="Todos os pacotes PHP estao atualizados."
            COMPOSER_FIX=""
          else
            COMPOSER_SECTION="$COMPOSER_OUTDATED_RAW"
            # Gera lista de comandos para atualizar cada pacote listado
            COMPOSER_FIX=$(echo "$COMPOSER_OUTDATED_RAW" | awk 'NF>=2 {print "composer require " $1 ":^" $3}' 2>/dev/null | head -20)
            if [ -z "$COMPOSER_FIX" ]; then
              COMPOSER_FIX="composer update"
            fi
          fi

          # Pacotes NPM desatualizados e comandos de correcao
          NPM_OUTDATED_RAW=$(cat npm-outdated.txt 2>/dev/null || echo "Informacao nao disponivel")

          if echo "$NPM_OUTDATED_RAW" | grep -q "atualizados"; then
            NPM_SECTION="Todos os pacotes NPM estao atualizados."
            NPM_FIX=""
          else
            NPM_SECTION="$NPM_OUTDATED_RAW"
            # Gera lista de comandos para atualizar cada pacote listado
            NPM_FIX=$(echo "$NPM_OUTDATED_RAW" | awk 'NR>1 && NF>=4 {print "npm install " $1 "@" $4}' 2>/dev/null | head -20)
            if [ -z "$NPM_FIX" ]; then
              NPM_FIX="npm update"
            fi
          fi

          GIT_LOG=$(git log --oneline -5 --no-color)

          # Arquivos modificados no ultimo commit
          FILES_CHANGED=$(git diff-tree --no-commit-id -r --name-status HEAD | head -40)

          # Estatisticas do ultimo commit
          GIT_STAT=$(git diff --stat HEAD~1 HEAD 2>/dev/null || echo "Primeiro commit do repositorio")

          cat > relatorio.md << MARKDOWN
          # Relatorio de Pipeline — Smart Attendance

          **Data e Hora:** ${DATA_HORA}
          **Branch:** \`${BRANCH}\`
          **Commit:** \`${COMMIT_SHORT}\` ([ver no GitHub](https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}))
          **Autor:** ${AUTOR}
          **Pipeline:** [Execucao #${RUN_ID}](${RUN_URL})

          ---

          ## Resultado dos Modulos

          | Modulo | Descricao | Status |
          |--------|-----------|--------|
          | 1 | Configuracao (PHP, Node, Vite) | PASSOU |
          | 2 | Banco de Dados (Migrations) | PASSOU |
          | 3 | Seguranca do Codigo e Banco | PASSOU |
          | 4 | Classes Aluno, Master e Professor | PASSOU |
          | 5 | Testes Finais (Suite Completa) | PASSOU |
          | 6 | Trabalho Completo (Deploy) | EM EXECUCAO |

          ---

          ## Pacotes PHP Desatualizados

          \`\`\`
          ${COMPOSER_SECTION}
          \`\`\`

          $([ -n "$COMPOSER_FIX" ] && echo "**Comandos para atualizar:**" && echo "" && echo "\`\`\`bash" && echo "${COMPOSER_FIX}" && echo "\`\`\`")

          ---

          ## Pacotes NPM Desatualizados

          \`\`\`
          ${NPM_SECTION}
          \`\`\`

          $([ -n "$NPM_FIX" ] && echo "**Comandos para atualizar:**" && echo "" && echo "\`\`\`bash" && echo "${NPM_FIX}" && echo "\`\`\`")

          ---

          ## Arquivos Modificados no Commit

          \`\`\`
          ${FILES_CHANGED}
          \`\`\`

          ---

          ## Estatisticas das Alteracoes

          \`\`\`
          ${GIT_STAT}
          \`\`\`

          ---

          ## Historico Recente (ultimos 5 commits)

          \`\`\`
          ${GIT_LOG}
          \`\`\`

          ---

          ## Informacoes do Ambiente de Testes

          - **Sistema Operacional:** Ubuntu Latest (GitHub Actions)
          - **PHP:** ${{ env.PHP_VERSION }}
          - **Node.js:** ${{ env.NODE_VERSION }}
          - **Banco de Dados (testes):** PostgreSQL 16
          - **Framework:** Laravel

          ---

          *Relatorio gerado automaticamente pelo pipeline CI/CD do GitHub Actions.*
          MARKDOWN

      - name: Converter relatorio Markdown para PDF
        run: |
          pandoc relatorio.md \
            -o relatorio-pipeline-${{ github.run_id }}.pdf \
            --pdf-engine=wkhtmltopdf \
            --variable papersize=a4 \
            --variable margin-top=20mm \
            --variable margin-bottom=20mm \
            --variable margin-left=25mm \
            --variable margin-right=25mm \
            -V title="Smart Attendance — Relatorio de Pipeline" \
            --standalone

      - name: Publicar relatorio PDF como artefato do GitHub
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-pipeline-${{ github.run_id }}
          path: relatorio-pipeline-${{ github.run_id }}.pdf
          retention-days: 30

      - name: Salvar PDF na pasta tests/PDF do repositorio
        run: |
          # Mensagem do ultimo commit (sanitizada para nome de pasta)
          COMMIT_MSG=$(git log -1 --format="%s" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9 _-]//g' \
            | sed 's/ \+/_/g' \
            | sed 's/_\+/_/g' \
            | cut -c1-60 \
            | sed 's/_$//')

          DATA=$(date '+%Y-%m-%d')

          # Nome da pasta: DATA_mensagem-do-commit
          NOME_PASTA="${DATA}_${COMMIT_MSG}"
          PASTA_DESTINO="tests/PDF/${NOME_PASTA}"

          echo "Criando pasta: ${PASTA_DESTINO}"
          mkdir -p "${PASTA_DESTINO}"

          # Copia o PDF gerado para a pasta do repositorio
          cp relatorio-pipeline-${{ github.run_id }}.pdf \
            "${PASTA_DESTINO}/relatorio-pipeline.pdf"

          echo "PDF salvo em: ${PASTA_DESTINO}/relatorio-pipeline.pdf"

      - name: Configurar Git para commit automatico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commitar e publicar PDF no repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(date '+%Y-%m-%d')
          COMMIT_MSG=$(git log -1 --format="%s" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9 _-]//g' \
            | sed 's/ \+/_/g' \
            | cut -c1-60)

          NOME_PASTA="${DATA}_${COMMIT_MSG}"

          git add "tests/PDF/${NOME_PASTA}/"

          # [skip ci] evita que este commit dispare uma nova execucao do pipeline
          git commit -m "docs(pdf): relatorio pipeline ${DATA} [skip ci]" \
            || echo "Nenhuma alteracao para commitar"

          git push origin main \
            || echo "Push falhou — pode ja estar atualizado"

      # Descomente quando tiver servidor configurado:
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USERNAME }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd ${{ secrets.DEPLOY_PATH }}
      #       php artisan down
      #       git pull origin main
      #       composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      #       npm ci && npm run build
      #       php artisan migrate --force
      #       php artisan optimize:clear
      #       php artisan config:cache
      #       php artisan route:cache
      #       php artisan view:cache
      #       chmod -R 775 storage bootstrap/cache
      #       php artisan up

      - name: Pipeline concluido com sucesso
        run: |
          echo "Modulo 1 - Configuracao:       OK"
          echo "Modulo 2 - Banco de Dados:     OK"
          echo "Modulo 3 - Seguranca:          OK"
          echo "Modulo 4 - Classes (3 guards): OK"
          echo "Modulo 5 - Testes Finais:      OK"
          echo "Modulo 6 - Relatorio PDF:      Salvo em tests/PDF/"
          echo ""
          echo "O PDF foi comitado automaticamente em tests/PDF/"
          echo "E tambem esta disponivel em: Actions > Execucao atual > Artifacts"