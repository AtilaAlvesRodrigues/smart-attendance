name: Smart Attendance — CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Auditoria, Padrão de Código e Testes
  # Objetivo: garantir que o código está seguro, limpo e funcionando antes
  # de qualquer merge ou deploy.
  # ═══════════════════════════════════════════════════════════════════════════
  tests:
    name: Testes e Qualidade de Codigo
    runs-on: ubuntu-latest

    # ─── Serviço PostgreSQL (espelha o banco de produção) ─────────────────────
    # Ao usar PostgreSQL aqui, garantimos que consultas específicas da sintaxe
    # do Postgres (ex: ILIKE, arrays, JSONB) não passem nos testes mas quebrem
    # em produção — o que aconteceria se usássemos SQLite in-memory.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        # Aguarda o PostgreSQL estar pronto para aceitar conexões
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout do codigo
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 2. Configura o PHP 8.3 com extensão pdo_pgsql
      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      # 3. Configura o Node.js com cache automático do NPM
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Cache das dependências do Composer (reduz tempo da esteira)
      - name: Obter diretorio de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache das dependencias Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # 5. Prepara o .env de testes
      - name: Criar arquivo .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # 6. Instala dependências PHP
      - name: Instalar dependencias do Composer
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # 7. Auditoria de Segurança (CVEs em pacotes)
      - name: Auditoria de Seguranca PHP (composer audit)
        run: composer audit

      # 8. Padrão de Código (Laravel Pint)
      # O "--test" retorna exit code 1 se houver código fora do padrão.
      # Remova o "|| true" quando quiser que a esteira QUEBRE em estilo incorreto.
      - name: Verificar Padrao de Codigo (Laravel Pint)
        run: ./vendor/bin/pint --test || true

      # 9. Instala dependências NPM e compila o Vite
      - name: Build do Front-end (Vite)
        run: |
          npm ci
          npm run build

      # 10. Gera a chave da aplicação e ajusta permissões
      - name: Gerar chave da aplicacao
        run: php artisan key:generate

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      # 11. Executa as migrations no PostgreSQL de testes
      - name: Executar Migrations no PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: smart_attendance_test
          DB_USERNAME: sa_user
          DB_PASSWORD: sa_secret
        run: php artisan migrate --force

      # 12. Executa a Suite Completa de Testes
      # Os testes cobrem:
      #   • QrCodePresencaTest    — Geração e leitura dos QR Codes de presença
      #   • IsolamentoPaineisTest — Isolamento dos painéis por guard de autenticação
      #   • PrimeiroAcessoCriarSenhaTest — Fluxo de criação de senha no primeiro acesso
      #   • ExampleTest           — Smoke tests de rotas básicas
      - name: Executar Testes (PHPUnit/Pest)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: smart_attendance_test
          DB_USERNAME: sa_user
          DB_PASSWORD: sa_secret
          # Usa o cache em array durante os testes para isolar o estado entre os testes
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: php artisan test --parallel

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2 — Deploy Contínuo (CD)
  # Objetivo: se TODOS os testes passarem em um push na branch 'main',
  # fazer o deploy automaticamente no servidor de produção/homologação.
  #
  # PRÉ-REQUISITOS (configurar em Settings > Secrets and variables > Actions):
  #   SSH_HOST         → IP ou hostname do servidor (ex: 192.168.1.100)
  #   SSH_USERNAME     → Usuário SSH (ex: deploy, ubuntu, root)
  #   SSH_PRIVATE_KEY  → Chave SSH privada gerada para o deploy (ssh-keygen -t ed25519)
  #   DEPLOY_PATH      → Caminho absoluto no servidor (ex: /var/www/smart-attendance)
  #
  # COMO GERAR A CHAVE SSH:
  #   ssh-keygen -t ed25519 -C "github-actions-deploy"
  #   → Copie a PRIVADA para o Secret SSH_PRIVATE_KEY
  #   → Adicione a PÚBLICA ao ~/.ssh/authorized_keys no servidor
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy em Producao
    runs-on: ubuntu-latest
    needs: tests  # Só executa se o job 'tests' PASSAR completamente

    # Deploy só ocorre em push direto na branch 'main' (não em Pull Requests)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # Descomente e configure este step quando tiver um servidor
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USERNAME }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd ${{ secrets.DEPLOY_PATH }}
      #
      #       # Ativa o modo de manutenção enquanto o deploy ocorre
      #       php artisan down
      #
      #       # Puxa as últimas alterações da branch main
      #       git pull origin main
      #
      #       # Atualiza dependências PHP (sem dev em produção)
      #       composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      #
      #       # Atualiza dependências Node e reconstrói o front-end
      #       npm ci
      #       npm run build
      #
      #       # Executa novas migrations com segurança
      #       php artisan migrate --force
      #
      #       # Limpa e re-cacheia configurações para máxima performance
      #       php artisan optimize:clear
      #       php artisan config:cache
      #       php artisan route:cache
      #       php artisan view:cache
      #
      #       # Ajusta permissões necessárias
      #       chmod -R 775 storage bootstrap/cache
      #
      #       # Desativa o modo de manutenção — sistema volta ao ar
      #       php artisan up

      # Step temporário de aviso (remova ao ativar o deploy SSH acima)
      - name: Deploy SSH ainda nao configurado
        run: |
          echo "✅ Todos os testes passaram com sucesso!"
          echo ""
          echo "Para ativar o deploy automático:"
          echo "1. Configure os Secrets no GitHub:"
          echo "   - SSH_HOST, SSH_USERNAME, SSH_PRIVATE_KEY, DEPLOY_PATH"
          echo "2. Descomente o step 'Deploy via SSH' neste arquivo."
          echo ""
          echo "Consulte o README.md para instruções detalhadas."