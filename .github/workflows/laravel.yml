name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    # 1. Checkout do código (Movido para o topo, antes de configurar o ambiente)
    - uses: actions/checkout@v4

    # 2. Configura o PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.3'
        tools: composer:v2

    # 3. Configura o Node.js e ativa o cache do NPM automaticamente
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # 4. Mapeia e faz o Cache das dependências do Composer (Reduz o tempo da esteira)
    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    # 5. Prepara o ambiente Laravel
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    # 6. Instala dependências do Back-end
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs

    # 7. Auditoria de Segurança (Verifica vulnerabilidades em pacotes instalados)
    - name: Security Audit (PHP)
      run: composer audit

    # 8. Análise Estática e Padrão de Código (Laravel Pint)
    # O "|| true" garante que a esteira não quebre imediatamente se houver código fora do padrão estético
    - name: Check Code Style
      run: ./vendor/bin/pint --test || true

    # 9. Instala dependências e compila o Vite
    - name: Install NPM dependencies and build Vite
      run: |
        npm install
        npm run build

    # 10. Gera chave e ajusta permissões
    - name: Generate key
      run: php artisan key:generate
    
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    # 11. Prepara o Banco de Dados (SQLite)
    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    # 12. Executa os Testes
    - name: Execute tests (Unit and Feature tests) via PHPUnit/Pest
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test