name: Smart Attendance — CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Banco de testes descartável (container do próprio job) — não precisa de secrets,
# assim o pipeline também roda em Pull Requests vindos de forks.
env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  APP_ENV: testing
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: smart_attendance_test
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  MAIL_MAILER: array
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync

jobs:

  # ===========================================================================
  # MODULO 1 — CONFIGURACAO
  # Verifica versoes, instala dependencias, compila o front-end e gera
  # os relatorios de pacotes desatualizados/vulneraveis usados no Modulo 6.
  # ===========================================================================
  configuracao:
    name: "1 - Configuracao"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Versoes dos componentes
        run: php --version && composer --version && node --version && npm --version

      - name: Cache do Composer
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Compilar assets (Vite)
        run: npm run build

      - name: Relatorios de pacotes desatualizados e auditoria
        run: |
          composer outdated --direct --no-interaction > composer-outdated.txt 2>&1 || true
          [ -s composer-outdated.txt ] || echo "Todos os pacotes PHP estao atualizados." > composer-outdated.txt
          npm outdated > npm-outdated.txt 2>&1 || true
          [ -s npm-outdated.txt ] || echo "Todos os pacotes NPM estao atualizados." > npm-outdated.txt
          npm audit > npm-audit.txt 2>&1 || true

      - name: Salvar relatorios
        uses: actions/upload-artifact@v5
        with:
          name: relatorios-pacotes
          path: |
            composer-outdated.txt
            npm-outdated.txt
            npm-audit.txt
          retention-days: 7

  # ===========================================================================
  # MODULOS 2 a 5 — BANCO, SEGURANCA, CLASSES E TESTES
  # Cada modulo sobe seu proprio PostgreSQL e instala dependencias via cache.
  # ===========================================================================
  modulos:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    needs: configuracao
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: "2 - Banco de Dados"
            modulo: banco
          - nome: "3 - Seguranca do Codigo e Banco"
            modulo: seguranca
          - nome: "4 - Classes Aluno, Master e Professor"
            modulo: classes
          - nome: "5 - Testes Finais"
            modulo: testes

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias e preparar ambiente
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci && npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Executar migrations
        run: php artisan migrate --force

      # --- Modulo 2 ---------------------------------------------------------
      - name: Status das migrations e seed idempotente
        if: matrix.modulo == 'banco'
        run: |
          php artisan migrate:status
          php artisan db:seed --force
          php artisan db:seed --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      # --- Modulo 3 ---------------------------------------------------------
      - name: Auditoria de vulnerabilidades PHP (composer audit)
        if: matrix.modulo == 'seguranca'
        run: composer audit

      - name: Testes das camadas de seguranca
        if: matrix.modulo == 'seguranca'
        run: php artisan test --filter '(Csrf|Xss|SqlInjection|ColumnInjection|SecurityHeaders|RateLimit|Honeypot|Encryption|BlindIndex|UnauthorizedAccess)Test'

      - name: Listar rotas (detecta conflitos de rota)
        if: matrix.modulo == 'seguranca'
        run: php artisan route:list

      # --- Modulo 4 ---------------------------------------------------------
      - name: Testar classes e isolamento entre paineis
        if: matrix.modulo == 'classes'
        run: php artisan test --filter '(PrimeiroAcessoCriarSenha|IsolamentoPaineis|RoleMiddleware|MasterCadastro|SolicitacaoAcesso)Test'

      # --- Modulo 5 ---------------------------------------------------------
      - name: Executar suite completa de testes
        if: matrix.modulo == 'testes'
        run: php artisan test

  # ===========================================================================
  # MODULO 6 — TRABALHO COMPLETO
  # Gera o relatorio PDF do pipeline e publica como artefato da execucao
  # (Actions > execucao > Artifacts). Nao commita nada no repositorio.
  # ===========================================================================
  trabalho_completo:
    name: "6 - Trabalho Completo"
    runs-on: ubuntu-latest
    needs: modulos
    if: github.event_name != 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 10

      - uses: actions/download-artifact@v5
        with:
          name: relatorios-pacotes

      - name: Instalar pandoc e wkhtmltopdf
        run: sudo apt-get update -q && sudo apt-get install -y -q pandoc wkhtmltopdf

      - name: Gerar relatorio Markdown
        run: |
          {
            echo "# Relatorio de Pipeline — Smart Attendance"
            echo
            echo "**Data e Hora:** $(date '+%d/%m/%Y às %H:%M:%S UTC')  "
            echo "**Branch:** \`${{ github.ref_name }}\`  "
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})  "
            echo "**Autor:** ${{ github.actor }}  "
            echo "**Pipeline:** [Execucao #${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo "## Resultado dos Modulos"
            echo
            echo "| Modulo | Descricao | Status |"
            echo "|---|---|---|"
            echo "| 1 | Configuracao (PHP, Node, Vite) | PASSOU |"
            echo "| 2 | Banco de Dados (Migrations e Seed) | PASSOU |"
            echo "| 3 | Seguranca do Codigo e Banco | PASSOU |"
            echo "| 4 | Classes Aluno, Master e Professor | PASSOU |"
            echo "| 5 | Testes Finais (Suite Completa) | PASSOU |"
            echo
            echo "## Pacotes PHP desatualizados"
            echo '```'; cat composer-outdated.txt; echo '```'
            echo
            echo "## Pacotes NPM desatualizados"
            echo '```'; cat npm-outdated.txt; echo '```'
            echo
            echo "## Auditoria NPM"
            echo '```'; cat npm-audit.txt; echo '```'
            echo
            echo "## Arquivos modificados no commit"
            echo '```'; git diff-tree --no-commit-id -r --name-status HEAD | head -40; echo '```'
            echo
            echo "## Historico recente"
            echo '```'; git log --oneline -5 --no-color; echo '```'
            echo
            echo "*Relatorio gerado automaticamente pelo GitHub Actions.*"
          } > relatorio.md

      - name: Converter para PDF
        run: |
          pandoc relatorio.md -o relatorio-pipeline.pdf --pdf-engine=wkhtmltopdf \
            -V papersize=a4 -V margin-top=20mm -V margin-bottom=20mm \
            -V margin-left=25mm -V margin-right=25mm \
            -V title="Smart Attendance — Relatorio de Pipeline" --standalone

      - name: Publicar relatorio PDF
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-pipeline-${{ github.run_id }}
          path: relatorio-pipeline.pdf
          retention-days: 90
