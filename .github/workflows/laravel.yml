name: Smart Attendance — CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '20'
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: smart_attendance_test
  DB_USERNAME: sa_user
  DB_PASSWORD: sa_secret
  CACHE_STORE: array
  SESSION_DRIVER: array

jobs:

  # ===========================================================================
  # MODULO 1 — CONFIGURACAO
  # Instala dependencias PHP e Node, compila o front-end e salva os artefatos
  # vendor/ e public/build/ para reutilizacao nos modulos seguintes.
  # Cada job recria o proprio .env a partir do .env.example (mais seguro).
  # ===========================================================================
  configuracao:
    name: "1 - Configuracao"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verificar versoes dos componentes instalados
        run: |
          echo "=== PHP ==="
          php --version
          echo "=== Composer ==="
          composer --version
          echo "=== Node.js ==="
          node --version
          echo "=== NPM ==="
          npm --version

      - name: Cache das dependencias do Composer
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-vendor-

      - name: Instalar dependencias do Composer
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Verificar pacotes PHP desatualizados (composer outdated)
        # Mostra quais pacotes tem versoes mais novas disponíveis.
        # "|| true" garante que a esteira nao quebre — e apenas um aviso informativo.
        run: composer outdated --direct --no-interaction || true

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Instalar dependencias NPM e compilar Vite
        run: |
          npm ci
          npm run build

      - name: Verificar pacotes NPM desatualizados (npm outdated)
        # Mostra quais pacotes Node tem versoes mais novas disponíveis.
        # "|| true" garante que a esteira nao quebre — e apenas um aviso informativo.
        run: npm outdated || true

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Salvar vendor como artefato
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor
          retention-days: 1

      - name: Salvar assets compilados como artefato
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          retention-days: 1

  # ===========================================================================
  # MODULO 2 — BANCO DE DADOS
  # Sobe PostgreSQL identico ao de producao, restaura os artefatos do Modulo 1
  # e executa todas as migrations para validar o schema completo.
  # ===========================================================================
  banco_de_dados:
    name: "2 - Banco de Dados"
    runs-on: ubuntu-latest
    needs: configuracao

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Executar todas as Migrations
        run: php artisan migrate --force

      - name: Verificar status das Migrations
        run: php artisan migrate:status

  # ===========================================================================
  # MODULO 3 — VERIFICACAO DE SEGURANCA DO CODIGO E DO BANCO DE DADOS
  # Audita CVEs nos pacotes, valida padrao de codigo com Pint e verifica
  # se as rotas do sistema nao tem conflitos. Roda em paralelo com Modulo 2.
  # ===========================================================================
  seguranca:
    name: "3 - Seguranca do Codigo e Banco"
    runs-on: ubuntu-latest
    needs: configuracao

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Auditoria de vulnerabilidades PHP (composer audit)
        run: composer audit

      - name: Verificar padrao de codigo (Laravel Pint)
        run: ./vendor/bin/pint --test || true

      - name: Verificar integridade das migrations no banco
        run: php artisan migrate --force

      - name: Listar rotas do sistema (detecta conflitos de rota)
        run: php artisan route:list

  # ===========================================================================
  # MODULO 4 — VERIFICAR ERROS NAS 3 CLASSES (Aluno, Master e Professor)
  # Valida que as factories e o fluxo de autenticacao funcionam corretamente
  # para cada um dos 3 guards do sistema.
  # Depende dos Modulos 2 e 3 (banco OK + seguranca OK).
  # ===========================================================================
  verificar_classes:
    name: "4 - Classes Aluno, Master e Professor"
    runs-on: ubuntu-latest
    needs: [ banco_de_dados, seguranca ]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Restaurar assets do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Executar migrations
        run: php artisan migrate --force

      # Cobre os 3 guards: Aluno, Professor e Master (primeiro acesso e criacao de senha)
      - name: Testar classe Aluno e Professor (PrimeiroAcessoCriarSenhaTest)
        run: php artisan test --filter PrimeiroAcessoCriarSenhaTest

      # Valida que aluno nao acessa painel do professor e vice-versa
      - name: Testar isolamento entre classes (IsolamentoPaineisTest)
        run: php artisan test --filter IsolamentoPaineisTest

  # ===========================================================================
  # MODULO 5 — TESTES FINAIS
  # Executa a suite completa de testes (Unit + Feature).
  # So roda se todas as classes individuais passaram no Modulo 4.
  # ===========================================================================
  testes_finais:
    name: "5 - Testes Finais"
    runs-on: ubuntu-latest
    needs: verificar_classes

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_attendance_test
          POSTGRES_USER: sa_user
          POSTGRES_PASSWORD: sa_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_pgsql, pgsql
          tools: composer:v2

      - name: Restaurar vendor do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor

      - name: Restaurar assets do Modulo 1
        uses: actions/download-artifact@v4
        with:
          name: public-build
          path: public/build

      - name: Criar .env e gerar chave da aplicacao
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ajustar permissoes de diretorios
        run: chmod -R 777 storage bootstrap/cache

      - name: Executar migrations
        run: php artisan migrate --force

      # Suite completa: ExampleTest + QrCodePresencaTest + IsolamentoPaineisTest
      #                 + PrimeiroAcessoCriarSenhaTest + Unit/ExampleTest
      - name: Executar suite completa de testes
        run: php artisan test

  # ===========================================================================
  # MODULO 6 — TRABALHO COMPLETO (Deploy)
  # So executa se TODOS os 5 modulos anteriores passaram E o evento for
  # um push direto na branch main (nao em Pull Requests).
  #
  # Para ativar: configure os Secrets em Settings > Secrets > Actions:
  #   SSH_HOST        — IP ou hostname do servidor
  #   SSH_USERNAME    — Usuario SSH (ex: ubuntu, deploy)
  #   SSH_PRIVATE_KEY — Chave SSH privada (ssh-keygen -t ed25519)
  #   DEPLOY_PATH     — Caminho no servidor (ex: /var/www/smart-attendance)
  # ===========================================================================
  trabalho_completo:
    name: "6 - Trabalho Completo"
    runs-on: ubuntu-latest
    needs: testes_finais
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # Descomente o bloco abaixo quando tiver um servidor configurado:
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.SSH_HOST }}
      #     username: ${{ secrets.SSH_USERNAME }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd ${{ secrets.DEPLOY_PATH }}
      #       php artisan down
      #       git pull origin main
      #       composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      #       npm ci
      #       npm run build
      #       php artisan migrate --force
      #       php artisan optimize:clear
      #       php artisan config:cache
      #       php artisan route:cache
      #       php artisan view:cache
      #       chmod -R 775 storage bootstrap/cache
      #       php artisan up

      - name: Pipeline concluido com sucesso
        run: |
          echo "Modulo 1 - Configuracao:       OK"
          echo "Modulo 2 - Banco de Dados:     OK"
          echo "Modulo 3 - Seguranca:          OK"
          echo "Modulo 4 - Classes (3 guards): OK"
          echo "Modulo 5 - Testes Finais:      OK"
          echo "Modulo 6 - Trabalho Completo:  Aguardando servidor SSH"
          echo ""
          echo "Para ativar o deploy automatico, configure os Secrets:"
          echo "  SSH_HOST, SSH_USERNAME, SSH_PRIVATE_KEY, DEPLOY_PATH"