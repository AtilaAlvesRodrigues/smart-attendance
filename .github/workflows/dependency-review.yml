name: Revisão de dependências

# Em Pull Requests: bloqueia a entrada de pacote com vulnerabilidade alta ou crítica.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  revisar:
    name: Pacotes novos sem vulnerabilidade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
