name: Revisão de dependências

# Em Pull Requests: bloqueia a entrada de pacote com vulnerabilidade alta ou crítica.
on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  revisar:
    name: Pacotes novos sem vulnerabilidade
    # Exige o "Dependency graph" ligado (Settings → Code security). Enquanto estiver desligado a
    # action falha por configuração, não por código, então o job só roda com a variável do
    # repositório DEPENDENCY_GRAPH_ATIVO=true (Settings → Secrets and variables → Actions → Variables).
    if: vars.DEPENDENCY_GRAPH_ATIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # inclui as dependências de desenvolvimento (o padrão só olha as de runtime)
          fail-on-scopes: runtime, development
          comment-summary-in-pr: on-failure
